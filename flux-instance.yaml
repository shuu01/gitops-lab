# FluxInstance is managed in the flux repo (git-is-authoritative).
# This is also a bootstrap-only seed for terraform provisioning.
# Keep BOTH files byte-identical - sync from the flux repo before cluster creation.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  distribution:
    version: "2.9.x"
    registry: ghcr.io/fluxcd
  sync:
    kind: GitRepository
    url: https://github.com/shuu01/flux.git
    ref: refs/heads/main
    path: clusters/staging
    provider: github
    pullSecret: flux-gitops
